  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);

--ind:#818CF8;--rose:#FB7185;--em:#34D399;--am:#F59E0B;--ease:cubic-bezier(.22,1,.36,1)}\nbody{margin:0}\n.app *{box-sizing:border-box}\n.app{font-family:'Geist',system-ui,sans-serif;color:#E8EAF2;-webkit-font-smoothing:antialiased}\n.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#E8EAF2;font:500 13px/1 'Geist',system-ui,sans-serif;letter-spacing:-.005em;cursor:pointer;position:relative;white-space:nowrap;transition:background-color 150ms cubic-bezier(.22,1,.36,1),border-color 150ms cubic-bezier(.22,1,.36,1),transform 150ms cubic-bezier(.22,1,.36,1),color 150ms cubic-bezier(.22,1,.36,1)}\n.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);transform:translateY(-1px)}\n.btn:active{transform:scale(.98)}\n.btn:focus-visible,.tool:focus-visible,.sw:focus-visible,.zbtn:focus-visible{outline:2px solid #818CF8;outline-offset:2px}\n.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}\n.ic{width:32px;padding:0}\n.btn.primary{background:#4F46E5;border-color:#4F46E5;color:#fff}\n.btn.primary:hover{background:#5B54EA;border-color:#5B54EA}\n.btn.ghost{border-color:transparent}\n.btn.prune{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.08);color:#FDA4AF}\n.btn.prune:hover{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.8)}\n.btn.restore{background:#047857;border-color:#047857;color:#fff}\n.btn.restore:hover{background:#059669;border-color:#059669}\n.btn.restore-o{border-color:rgba(52,211,153,.4);color:#6EE7B7}\n.btn.restore-o:hover{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.7)}\n.btn.bm-on{color:#F59E0B;border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}\n.tool{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border g:-.01em\">FocusDeck<\u002Fspan>\n      <span class=\"mono\" style=\"font-size:9.5px;font-weight:500;letter-spacing:.1em;color:#98A0B6;border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:3px 5px\">PRO<\u002Fspan>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{ openPalette }}\" aria-label=\"Open command palette\" style=\"width:360px;justify-content:flex-start;height:28px;background:#11151F;color:#98A0B6;font-weight:400;-webkit-app-region:no-drag\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.search }}\"><\u002Fpath><\u002Fsvg>\n      <span style=\"flex:1;text-align:left\">Command Palette<\u002Fspan>\n      <span class=\"kbd\">Ctrl K<\u002Fspan>\n    <\u002Fbutton>\n    <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:6px;-webkit-app-region:no-drag\">\n      <button class=\"btn\" sc-camel-on-click=\"{{ togglePomo }}\" aria-label=\"Toggle Pomodoro widget\" aria-pressed=\"{{ pomo }}\" style=\"height:28px;padding:0 10px;background:rgba(129,140,248,.1);border-color:rgba(129,140,248,.3);color:#C7D2FE\">\n        <span class=\"pulse\" style=\"width:6px;height:6px;border-radius:50%;background:#818CF8\"><\u002Fspan>\n        <span class=\"mono\" style=\"font-size:12px\">24:12<\u002Fspan>\n        <span style=\"font-size:12px;color:#98A0B6\">Study<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"btn ic\" data-tip=\"Snapshots · 4\" aria-label=\"Snapshots, 4 checkpoints\" sc-camel-on-click=\"{{ goTimeline }}\" style=\"height:28px;width:28px;border-color:transparent\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.history }}\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n =\"btn restore\" sc-camel-on-click=\"{{ togglePrune }}\" style=\"width:200px;flex:none\" aria-label=\"Page 7 pruned, restore\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n        Page 7 Pruned · Restore\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <button class=\"{{ bmCls }}\" sc-camel-on-click=\"{{ toggleBm }}\" data-tip=\"Bookmark page\" aria-label=\"Bookmark page\" aria-pressed=\"{{ bm }}\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"{{ bmFill }}\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.bookmark }}\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <div style=\"display:flex;gap:4px\">\n      <button class=\"btn ic ghost\" data-tip=\"Undo · Ctrl Z\" aria-label=\"Undo\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.undo }}\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn ic ghost\" disabled=\"\" aria-label=\"Redo\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.redo }}\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <span class=\"sep\"><\u002Fspan>\n    <!-- Group 2 -->\n    <div role=\"radiogroup\" aria-label=\"Tool\" style=\"display:flex;gap:2px;padding:3px;border-radius:10px;background:#11151F;border:1px solid rgba(255,255,255,.08)\">\n      <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <button role=\"radio\" class=\"{{ t.cls }}\" aria-checke \" rx=\"1.5\" fill=\"#818CF8\"><\u002Frect><circle cx=\"24\" cy=\"10\" r=\"7\" fill=\"#E8EAF2\"><\u002Fcircle><\u002Fsvg>\n        <span class=\"mono\" style=\"font-size:12px;color:#E8EAF2;width:34px\">4 px<\u002Fspan>\n        <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"#11151F\" stroke=\"rgba(255,255,255,.08)\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"#2563EB\"><\u002Fcircle><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showShapes }}\" hint-placeholder-val=\"{{ false }}\">\n        <span class=\"lbl\">Shape<\u002Fspan>\n        <div role=\"radiogroup\" aria-label=\"Shape\" style=\"display:flex;gap:2px;padding:3px;border-radius:10px;background:#11151F;border:1px solid rgba(255,255,255,.08)\">\n          <sc-for list=\"{{ shapes }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <button role=\"radio\" class=\"{{ h.cls }}\" aria-checked=\"{{ h.checked }}\" aria-label=\"{{ h.label }}\" data-tip=\"{{ h.label }}\" sc-camel-on-click=\"{{ h.pick }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ h.d }}\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#98A0B6\">Hold <span class=\"kbd\">Shift<\u002Fspan> for square or circle<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n        <span class=\"lbl\">Paper<\u002Fspan>\n        <div style=\"display:flex;gap:2px\">\n          <sc-for list=\"{{ papers }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button class=\"sw\" aria-label=\"{{ p.name }}\" aria-pressed=\"{{ p.sel }}\" sc-camel-on-click=\"{{ p.pick }}\">\n              <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"3\" fill=\"{{ p.c }}\"><\u002Frect><rect x=\"2.5\" y=\"2.5\" width=\"19\" height=\"19\" rx=\"5\" fill=\"none\" stroke=\"{{ p.ring }}\" stroke-width=\"{{ p.rw }}\"><\u002Frect><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#98A0B6\">Click the page to place a note<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showNone }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:12px;color:#98A0B6\">{{ toolHint }}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <span class=\"sep\"><\u002Fspan>\n    <!-- Group 4 -->\n    <div style=\"display:flex;align-items:center;gap:2px\">\n      <button class=\"btn ic ghost\" data-tip=\"Zoom out\" aria-label=\"Zoom out\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn ghost mono\" style=\"width:68px;padding:0 8px;gap:4px\" aria-label=\"Zoom level 100 percent\">100%<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#98A0B6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn ic ghost\" data-tip=\"Zoom in\" aria-label=\"Zoom in\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14 M12 5v14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div role=\"radiogroup\" aria-label=\"Paper tone\" style=\"display:flex;gap:2px;padding:3px;border-radius:10px;background:#11151F;border:1px solid rgba(255,255,255,.08)\">\n      <button role=\"radio\" class=\"tool on\" aria-checked=\"true\" aria-label=\"Dark stage\" data-tip=\"Dark stage\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\" fill=\"#F7F7F5\" stroke=\"currentColor\" stroke-width=\"1.75\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n      <button role=\"radio\" class=\"tool\" aria-checked=\"false\" aria-label=\"Sepia\" tabindex=\"-1\" data-tip=\"Sepia\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\" fill=\"#E6D5AE\" stroke=\"currentColor\" stroke-width=\"1.75\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n      <button role=\"radio\" class=\"tool\" aria-checked=\"false\" aria-label=\"Night mode\" tabindex=\"-1\" data-tip=\"Night mode\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\" fill=\"#1B2030\" stroke=\"currentColor\" stroke-width=\"1.75\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"btn ic\" data-tip=\"Zen mode · Z\" aria-label=\"Zen mode\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.zen }}\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- REGIONS 4 + 5 -->\n  <div style=\"flex:1;min-height:0;display:flex\">\n    <dc-import name=\"Sidebar\" tab=\"{{ tab }}\" pruned=\"{{ pruned }}\" set-tab=\"{{ setTab }}\" hint-size=\"320px,760px\"><\u002Fdc-import>\n\n    <main aria-label=\"Document viewport\" style=\"flex:1;min-width:0;position:relative;background:#0A0D14;overflow:hidden\">\n      <div style=\"position:absolute;left:0;right:0;top:16px;display:flex;justify-content:center\">\n        <article aria-label=\"Page 7 of 24\" style=\"position:relative;width:560px;height:728px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 16px 40px rgba(0,0,0,.5);color:#0E1220;font-family:'Newsreader',Georgia,serif;padding:44px 52px 0\">\n          <div style=\"display:flex;justify-content:space-between;font:500 8.5px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5B6173\"><span>CS 6460 · Distributed Systems<\u002Fspan><span>Chapter 4<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:28px;font:600 10px/1 'Geist',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#4F46E5\">Chapter 4<\u002Fdiv>\n          <h1 style=\"margin:10px 0 0;font:400 36px/1.04 'Instrument Serif',Georgia,serif;letter-spacing:-.01em;color:#0E1220;max-width:380px\">Distributed Consensus Protocols<\u002Fh1>\n          <div style=\"height:1px;background:#E4E4E0;margin:18px 0 16px\"><\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:12px;line-height:18px;color:#1B2030\">Consensus is the problem of getting a set of unreliable processes to agree on a single value. A protocol solves it only if it guarantees <span class=\"hl\">agreement<\u002Fspan> (no two correct processes decide differently), validity (the decided value was proposed by someone), and termination (every correct process eventually decides). The FLP impossibility result shows that no deterministic protocol can guarantee all three in a fully asynchronous system with even one crash fault, so practical systems add timeouts and leader election.<\u002Fp>\n          <p style=\"margin:0 0 14px;font-size:12px;line-height:18px;color:#1B2030\">Paxos and Raft sidestep FLP by assuming partial synchrony. Raft splits the problem into leader election, log replication, and safety. A candidate that gathers votes from a majority becomes leader for a term, and every committed entry must be stored on a majority of servers before it is acknowledged to the client.<\u002Fp>\n          <figure style=\"margin:0 0 14px\">\n            <svg width=\"456\" height=\"104\" sc-camel-view-box=\"0 0 456 104\" role=\"img\" aria-label=\"A leader sending AppendEntries to two followers, who acknowledge\">\n              <rect x=\"0.5\" y=\"0.5\" width=\"455\" height=\"103\" rx=\"6\" fill=\"#F7F7F5\" stroke=\"#E4E4E0\"><\u002Frect>\n              <circle cx=\"84\" cy=\"52\" r=\"26\" fill=\"#EEF0FF\" stroke=\"#4F46E5\" stroke-width=\"1.5\"><\u002Fcircle>\n              <text x=\"84\" y=\"49\" text-anchor=\"middle\" font-family=\"Geist, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#3730A3\">Leader<\u002Ftext>\n              <text x=\"84\" y=\"62\" text-anchor=\"middle\" font-family=\"Geist Mono, monospace\" font-size=\"9\" fill=\"#5B6173\">term 7<\u002Ftext>\n              <circle cx=\"372\" cy=\"26\" r=\"20\" fill=\"#fff\" stroke=\"#0E1220\" stroke-width=\"1.25\"><\u002Fcircle>\n              <text x=\"372\" y=\"30\" text-anchor=\"middle\" font-family=\"Geist, sans-serif\" font-size=\"11\" font-weight=\"500\" fill=\"#0E1220\">F1<\u002Ftext>\n              <circle cx=\"372\" cy=\"78\" r=\"20\" fill=\"#fff\" stroke=\"#0E1220\" stroke-width=\"1.25\"><\u002Fcircle>\n              <text x=\"372\" y=\"82\" text-anchor=\"middle\" font-family=\"Geist, sans-serif\" font-size=\"11\" font-weight=\"500\" fill=\"#0E1220\">F2<\u002Ftext>\n              <path d=\"M108 44 L350 28\" stroke=\"#0E1220\" stroke-width=\"1.25\" fill=\"none\"><\u002Fpath><path d=\"M344 24 L351 28 L343 32\" stroke=\"#0E1220\" stroke-width=\"1.25\" fill=\"none\"><\u002Fpath>\n              <path d=\"M108 60 L350 76\" stroke=\"#0E1220\" stroke-width=\"1.25\" fill=\"none\"><\u002Fpath><path d=\"M343 72 L351 76 L344 80\" stroke=\"#0E1220\" stroke-width=\"1.25\" fill=\"none\"><\u002Fpath>\n              <text x=\"228\" y=\"28\" text-anchor=\"middle\" font-family=\"Geist Mono, monospace\" font-size=\"9\" fill=\"#5B6173\">AppendEntries(idx 41)<\u002Ftext>\n              <text x=\"228\" y=\"86\" text-anchor=\"middle\" font-family=\"Geist Mono, monospace\" font-size=\"9\" fill=\"#5B6173\">ack<\u002Ftext>\n            <\u002Fsvg>\n            <figcaption style=\"margin-top:5px;font:500 9.5px/1.3 'Geist',sans-serif;color:#5B6173\">Figure 4.2 — A leader replicating a log entry to two followers.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <div style=\"position:relative;text-align:center;margin:0 0 14px;padding:10px 0\">\n            <div style=\"font-size:16px;font-style:italic;letter-spacing:.01em\">quorum = ⌊n / 2⌋ + 1<\u002Fdiv>\n            <div style=\"margin-top:4px;font:400 9.5px/1.3 'Geist Mono',monospace;color:#5B6173\">tolerates f = ⌊(n − 1) / 2⌋ crash faults<\u002Fdiv>\n            <svg width=\"300\" height=\"56\" sc-camel-view-box=\"0 0 300 56\" aria-hidden=\"true\" style=\"position:absolute;left:78px;top:-2px\"><path d=\"M6 8 C60 3, 150 6, 292 5 C297 18, 296 36, 293 50 C200 54, 110 51, 8 52 C3 38, 4 22, 6 8 Z\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <p style=\"position:relative;margin:0;font-size:12px;line-height:18px;color:#1B2030\">Because any two majorities intersect in at least one server, a new leader is guaranteed to see every committed entry. This is why a five-server cluster survives two failures, while a four-server cluster still survives only one.\n            <svg width=\"330\" height=\"14\" sc-camel-view-box=\"0 0 330 14\" aria-hidden=\"true\" style=\"position:absolute;left:0;top:14px\"><path d=\"M2 8 C40 11, 90 4, 150 8 S260 5, 328 8\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fp>\n          <div class=\"mono\" style=\"position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:9.5px;color:#5B6173\">— 7 —<\u002Fdiv>\n\n          <!-- audio pin -->\n          <div style=\"position:absolute;left:402px;top:90px;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;background:#EEF0FF;border:1px solid #C7D2FE;color:#3730A3;box-shadow:0 2px 8px rgba(14,18,32,.12)\">\n            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.mic }}\"><\u002Fpath><\u002Fsvg>\n            <span class=\"mono\" style=\"font-size:10.5px;font-weight:500\">0:42<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- sticky note -->\n          <div style=\"position:absolute;left:492px;top:292px;width:176px;border-radius:8px;background:#FDE68A;color:#3B2F00;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 14px 28px rgba(14,18,32,.28);transform:rotate(1.4deg)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 6px 0 8px;border-bottom:1px solid rgba(59,47,0,.12);cursor:grab\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(59,47,0,.6)\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M9 6h.01 M9 12h.01 M9 18h.01 M15 6h.01 M15 12h.01 M15 18h.01\"><\u002Fpath><\u002Fsvg>\n              <button aria-label=\"Delete note\" style=\"width:20px;height:20px;border:0;background:none;padding:0;color:rgba(59,47,0,.65);cursor:pointer;display:flex;align-items:center;justify-content:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18 M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:8px 10px 12px;font:500 12px/1.4 'Geist',sans-serif\">Memorise: a majority quorum survives f failures when n = 2f + 1.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- prune shield -->\n          <sc-if value=\"{{ pruned }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;inset:0;border-radius:3px;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(225,29,72,.12) 0 12px,rgba(225,29,72,.24) 12px 24px);display:flex;align-items:center;justify-content:center\">\n              <div role=\"alert\" style=\"width:300px;padding:24px;border-radius:20px;background:rgba(10,13,20,.94);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(14,18,32,.35);text-align:center;font-family:'Geist',sans-serif\">\n                <span class=\"chip\" style=\"background:rgba(251,113,133,.14);color:#FDA4AF\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ i.trash }}\"><\u002Fpath><\u002Fsvg>Pruned<\u002Fspan>\n                <div style=\"margin:14px 0 6px;font:400 24px/1.1 'Instrument Serif',Georgia,serif;color:#E8EAF2\">Page 7 is out of your deck<\u002Fdiv>\n                <div style=\"margin-bottom:18px;font-size:12px;line-height:1.5;color:#98A0B6\">It will not appear in your export. Restore it any time.<\u002Fdiv>\n                <button class=\"btn restore\" sc-camel-on-click=\"{{ togglePrune }}\" style=\"height:36px;padding:0 18px\">Quick Restore<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <!-- minimap -->\n      <div role=\"img\" aria-label=\"Document map: 24 pages, 9 pruned, current page 7\" style=\"position:absolute;right:14px;top:50%;transform:translateY(-50%);width:10px\">\n        <sc-for list=\"{{ minimap }}\" as=\"m\" hint-placeholder-count=\"24\">\n          <div class=\"{{ m.cls }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- pagination pill -->\n      <nav aria-label=\"Page navigation\" style=\"position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;border-radius:20px;background:rgba(23,28,41,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.4)\">\n        <button class=\"btn ic ghost\" aria-label=\"Previous page\" style=\"border-radius:50%\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <span style=\"font-size:12px;color:#98A0B6;padding-left:4px\">Page<\u002Fspan>\n        <input class=\"pageinput\" type=\"text\" inputmode=\"numeric\" value=\"7\" readonly=\"\" aria-label=\"Jump to page\">\n        <span style=\"font-size:12px;color:#98A0B6;padding-right:4px\">of <span class=\"mono\" style=\"color:#E8EAF2\">24<\u002Fspan><\u002Fspan>\n        <button class=\"btn ic ghost\" aria-label=\"Next page\" style=\"border-radius:50%\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <span class=\"sep\" style=\"height:16px;margin:0 4px\"><\u002Fspan>\n        <button class=\"btn ghost\" style=\"height:28px;font-size:12px;padding:0 10px\">Fit Width<\u002Fbutton>\n      <\u002Fnav>\n\n      <sc-if value=\"{{ pomo }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;right:-4px;bottom:44px\">\n          <dc-import name=\"PomodoroWidget\" stage=\"{{ noStage }}\" hint-size=\"280px,352px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <!-- Overlays -->\n  <sc-if value=\"{{ palette }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAll }}\" style=\"position:absolute;inset:0;z-index:80;background:rgba(10,13,20,.62);backdrop-filter:blur(6px)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:81;display:flex;justify-content:center;padding-top:110px;pointer-events:none\">\n      <div style=\"pointer-events:auto\"><dc-import name=\"CommandPalette\" stage=\"{{ noStage }}\" hint-size=\"640px,330px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ exporting }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAll }}\" style=\"position:absolute;inset:0;z-index:80;background:rgba(10,13,20,.62);backdrop-filter:blur(6px)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:81;display:flex;justify-content:center;align-items:center;pointer-events:none\">\n      <div style=\"pointer-events:auto\"><dc-import name=\"ExportModal\" stage=\"{{ noStage }}\" on-close=\"{{ closeAll }}\" hint-size=\"640px,520px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { tool: 'pen', ink: 1, paper: 0, shape: 'rect', tab: 'thumbs', pruned: false, bm: true, palette: false, exporting: false, pomo: false };\n\n  renderVals() {\n    const s = this.state;\n    const i = {\n      search: 'M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M21 21l-4.3-4.3',\n      history: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2',\n      sliders: 'M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6',\n      download: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3',\n      layers: 'M12 2 2 7l10 5 10-5z M2 17l10 5 10-5 M2 12l10 5 10-5',\n      trash: 'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M10 11v6 M14 11v6',\n      clock: 'M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0 M12 6v6l4 2',\n      rotate: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5',\n      bookmark: 'm19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z',\n      undo: 'M9 14 4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11',\n      redo: 'm15 14 5-5-5-5 M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13',\n      mic: 'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z M19 10v2a7 7 0 0 1-14 0v-2 M12 19v3',\n      zen: 'M8 3H5a2 2 0 0 0-2 2v3 M21 8V5a2 2 0 0 0-2-2h-3 M3 16v3a2 2 0 0 0 2 2h3 M16 21h3a2 2 0 0 0 2-2v-3'\n    };\n    const toolDefs = [\n      ['select', 'Select', 'V', 'M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z'],\n      ['pen', 'Pen', 'P', 'M12 20h9 M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z'],\n      ['highlighter', 'Highlighter', 'H', 'm9 11-6 6v3h9l3-3 M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4'],\n      ['eraser', 'Eraser', 'E', 'm7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21 M22 21H7 M5 11l9 9'],\n      ['sticky', 'Sticky note', 'T', 'M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8z M15 3v4a2 2 0 0 0 2 2h4'],\n      ['shapes', 'Shapes', 'S', 'M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z M3 15a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z M14 17.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0'],\n      ['voice', 'Voice memo', 'M', i.mic]\n    ];\n    const tools = toolDefs.map(([k, label, key, d]) => ({\n      k, label, d, tip: label + ' (' + key + ')',\n      cls: s.tool === k ? 'tool on' : 'tool',\n      checked: s.tool === k, ti: s.tool === k ? 0 : -1,\n      pick: () => this.setState({ tool: k })\n    }));\n\n    const inkDefs = [['Ink black', '#0E1220'], ['Blue', '#2563EB'], ['Violet', '#7C3AED'], ['Pink', '#DB2777'], ['Red', '#DC2626'], ['Orange', '#EA580C'], ['Gold', '#CA8A04'], ['Green', '#16A34A']];\n    const inks = inkDefs.map(([name, c], n) => ({\n      name, c, sel: s.ink === n,\n      ring: s.ink === n ? '#818CF8' : 'rgba(255,255,255,.18)',\n      rw: s.ink === n ? 2 : 1,\n      pick: () => this.setState({ ink: n })\n    }));\n    const paperDefs = [['Yellow paper', '#FDE68A'], ['Mint paper', '#A7F3D0'], ['Sky paper', '#BAE6FD'], ['Lavender paper', '#DDD6FE']];\n    const papers = paperDefs.map(([name, c], n) => ({\n      name, c, sel: s.paper === n,\n      ring: s.paper === n ? '#818CF8' : 'rgba(255,255,255,.18)',\n      rw: s.paper === n ? 2 : 1,\n      pick: () => this.setState({ paper: n })\n    }));\n    const shapeDefs = [['rect', 'Rectangle', 'M3 5h18v14H3z'], ['circle', 'Circle', 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0'], ['arrow', 'Arrow', 'M5 12h14 M12 5l7 7-7 7'], ['line', 'Line', 'M5 19 19 5']];\n    const shapes = shapeDefs.map(([k, label, d]) => ({\n      label, d, cls: s.shape === k ? 'tool on' : 'tool', checked: s.shape === k,\n      pick: () => this.setState({ shape: k })\n    }));\n\n    const base = [2, 3, 5, 8, 9, 13, 14, 19, 20];\n    const bms = [4, 7, 11];\n    const minimap = [];\n    for (let n = 1; n <= 24; n++) {\n      const pr = base.includes(n) || (n === 7 && s.pruned);\n      let cls = 'seg keep';\n      if (n === 7) cls = 'seg cur';\n      else if (pr) cls = 'seg pr';\n      else if (bms.includes(n)) cls = 'seg bm';\n      minimap.push({ cls });\n    }\n\n    const prunedCount = 9 + (s.pruned ? 1 : 0);\n    const left = 24 - prunedCount;\n    const keptW = Math.round(240 * left / 24);\n    const hints = { select: 'Select and move notes, pins and shapes', eraser: 'Click a stroke to erase it', voice: 'Click the page to drop a voice memo pin' };\n\n    return {\n      i, tools, inks, papers, shapes, minimap,\n      tab: s.tab, pruned: s.pruned, notPruned: !s.pruned,\n      left, prunedCount, minutes: prunedCount * 3, pct: Math.floor(prunedCount / 24 * 100),\n      keptW, prunedW: 240 - keptW,\n      showInk: s.tool === 'pen' || s.tool === 'highlighter',\n      inkLabel: s.tool === 'pen' ? 'Pen' : 'Highlighter',\n      showShapes: s.tool === 'shapes', showSticky: s.tool === 'sticky',\n      showNone: ['select', 'eraser', 'voice'].includes(s.tool),\n      toolHint: hints[s.tool] || '',\n      bm: s.bm, bmCls: s.bm ? 'btn ic bm-on' : 'btn ic', bmFill: s.bm ? 'currentColor' : 'none',\n      palette: s.palette, exporting: s.exporting, pomo: s.pomo, noStage: false,\n      togglePrune: () => this.setState({ pruned: !this.state.pruned }),\n      toggleBm: () => this.setState({ bm: !this.state.bm }),\n      setTab: (k) => this.setState({ tab: k }),\n      goTimeline: () => this.setState({ tab: 'time' }),\n      openPalette: () => this.setState({ palette: true, exporting: false }),\n      openExport: () => this.setState({ exporting: true, palette: false }),\n      closeAll: () => this.setState({ palette: false, exporting: false }),\n      togglePomo: () => this.setState({ pomo: !this.state.pomo })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
